appId: com.eduardoborsa.digitalnomadapp
---
- launchApp:
    clearState: true
- runFlow: subflows/sign-in.yml

- tapOn:
    id: tab-profile
- tapOn:
    id: edit-profile-button

- tapOn:
    id: fullname-input
- eraseText: 100
- inputText: Maestro Name
- pressKey: Enter
- tapOn:
    id: submit-button

# Saving goes back to the profile, which shows the new name
- assertVisible:
    id: profile-fullname
    text: Maestro Name
