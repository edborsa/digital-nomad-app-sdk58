# Signs in the seeded in-memory user; expects the sign-in screen to be showing
appId: com.eduardoborsa.digitalnomadapp
---
- tapOn:
    id: email-input
# Android offers a saved login; this user types theirs (system UI has no testID)
- runFlow:
    when:
      visible: Use your saved password.*
    commands:
      - tapOn: Cancel
- inputText: contato@coffstack.com
- tapOn:
    id: password-input
- inputText: a123456b
# Return closes the keyboard; hideKeyboard is unreliable on iOS
- pressKey: Enter
- tapOn:
    id: sign-in-button
# iOS and Android offer to save the password; system UI has no testID
- tapOn:
    text: Not [Nn]ow
    optional: true
- assertVisible:
    id: tab-home
