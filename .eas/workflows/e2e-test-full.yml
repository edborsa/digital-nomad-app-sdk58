name: e2e-test-full

# Fresh iOS and Android builds, all flows. Run before a release:
#   eas workflow:run .eas/workflows/e2e-test-full.yml
on:
  workflow_dispatch: {}

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: maestro

  build_ios:
    type: build
    params:
      platform: ios
      profile: maestro

  maestro_test_android:
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      # Every top-level flow; Maestro skips the subflows/ folder
      flow_path: maestro

  maestro_test_ios:
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      # Every top-level flow; Maestro skips the subflows/ folder
      flow_path: maestro
