name: Check Code

on:
  pull_request:
    branches: ["*"]

jobs:
  check_code:
    name: Check Code jobs
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      # Same gates as local `npm run check`: expo-doctor, tsc, ESLint, Prettier, Jest with the coverage threshold
      - name: Run checks
        run: npm run check
